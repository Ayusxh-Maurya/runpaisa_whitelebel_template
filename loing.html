<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="assets/css/login.css">
   <!-- Bootstrap 4 CSS -->
<link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">  


</head>

<body>
  <h2>Welcome to Runpaisa!</h2>
            <div class="container" id="container">
                <div class="form-container sign-up-container">
                    <form action="#">
                        <h1>Retail Account</h1>
                        <span>or use your email for registration</span>
                        <input type="text" placeholder="Name" / class=" mb-2">
                        <input type="email" placeholder="Email"class=" mb-2" />
                        <input type="password" placeholder="Password"class=" mb-2" />
                        <button>Sign Up</button>
                    </form>
                </div>
                <div class="form-container sign-in-container">
                    <form action="#">
                        <h1>Merchant Account </h1>
                        <span>or use your account</span>
                        <input type="email" placeholder="Email" class=" mb-2"/>
                        <input type="password" placeholder="Password"class=" mb-2" />
                        <a href="#">Forgot your password?</a>
                        <button>Sign In</button>
                    </form>
                </div>
                <div class="overlay-container">
                    <div class="overlay">
                        <div class="overlay-panel overlay-left">
                            <h1>Welcome Back!</h1>
                            <p>To keep connected with us please login with your personal info</p>
                            <button class="ghost" id="signIn">Back</button>
                        </div>
                        <div class="overlay-panel overlay-right">
                            <h1>Hello, Friend!</h1>
                            <p>Enter your personal details and start journey with us</p>
                            <button class="ghost" id="signUp">GO to-Retail Account</button>
                        </div>
                    </div>
                </div>
            </div>
            
<script src="assets/js/login.js"></script>

</body>
</html>
